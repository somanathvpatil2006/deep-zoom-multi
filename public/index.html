<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deep Zoom Multi</title><style>body{margin:0;background:#0b0b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial;padding:15px}main{max-width:720px;margin:auto}.card{background:#17171b;border-radius:18px;padding:15px;margin:11px 0}button{width:100%;padding:13px;border:0;border-radius:13px;font-weight:700;margin-top:8px}select,input{width:100%;padding:11px;border-radius:10px;box-sizing:border-box}.item{display:flex;align-items:center;gap:8px;background:#24242a;padding:9px;border-radius:12px;margin:7px 0}.thumb{width:58px;height:58px;object-fit:cover;border-radius:8px}.move{width:auto;margin:0;padding:8px 10px;background:#444;color:white}small{color:#aaa}</style></head><body><main><h1>🎬 Deep Zoom Multi</h1><div class="card"><b>Upload 2–5 images</b><input id="files" type="file" accept="image/*" multiple></div><div class="card"><b>Zoom sequence</b><small>Use ▲ / ▼ to reorder images.</small><div id="list"></div></div><div class="card"><label>Format</label><select id="format"><option value="9:16">9:16 Short</option><option value="16:9">16:9</option><option value="1:1">1:1</option></select><label>Duration</label><select id="duration"><option>5</option><option selected>10</option><option>15</option><option>20</option></select><button id="preview">Create Preview</button><button id="final" style="display:none">Create Final Video</button><p id="status"><small>Upload at least 2 images.</small></p></div><video id="video" controls playsinline style="display:none;width:100%;border-radius:14px"></video><a id="save" style="display:none;text-align:center;margin-top:10px;background:white;color:#111;padding:13px;border-radius:13px;text-decoration:none;font-weight:700">Save / Share Video</a><script>let imgs=[];const files=document.getElementById('files'),list=document.getElementById('list'),status=document.getElementById('status');files.onchange=()=>{imgs=[...files.files].slice(0,5);draw()};function draw(){list.innerHTML='';imgs.forEach((f,i)=>{let d=document.createElement('div');d.className='item';let im=document.createElement('img');im.className='thumb';im.src=URL.createObjectURL(f);let t=document.createElement('span');t.style.flex='1';t.textContent=`Image ${i+1}`;let u=document.createElement('button');u.className='move';u.textContent='▲';u.onclick=()=>{if(i){[imgs[i-1],imgs[i]]=[imgs[i],imgs[i-1]];draw()}};let dn=document.createElement('button');dn.className='move';dn.textContent='▼';dn.onclick=()=>{if(i<imgs.length-1){[imgs[i+1],imgs[i]]=[imgs[i],imgs[i+1]];draw()}};d.append(im,t,u,dn);list.append(d)});status.innerHTML=`<small>${imgs.length} image(s). Recommended: 3–5.</small>`}async function make(final){if(imgs.length<2){alert("Please select at least 2 images.");return}status.innerHTML="<small>Creating video…</small>";let fd=new FormData();imgs.forEach(f=>fd.append("images",f));let p=await fetch("/api/prepare",{method:"POST",body:fd}),data=await p.json();if(!p.ok)throw Error(data.error);let r=await fetch("/api/render",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({images:data.images,duration:final?+duration.value:Math.min(5,+duration.value),fps:30,format:format.value})});if(!r.ok){let x=await r.json();throw Error(x.error)}let blob=await r.blob(),url=URL.createObjectURL(blob);video.src=url;video.style.display="block";save.href=url;save.download="deep-zoom-multi.mp4";save.style.display="block";status.innerHTML="<small>Done — review and save/share.</small>"}preview.onclick=()=>make(false).catch(e=>alert(e.message));final.onclick=()=>make(true).catch(e=>alert(e.message));</script></main></body></html>
